# Calendar page — rolling 5-week grid (Monday start), one cell per day.
#
# This is the PAGE HALF of the calendar feature (widget tree only). All logic
# (grid rendering, event fetching, the day popup) lives in ui/calendar.yaml —
# include that via `packages:` and include THIS file as a list item inside the
# device yaml's `lvgl.pages`, positioned where the page should sit in swipe
# order (ESPHome appends package pages BEFORE the device yaml's own pages, so
# a package could not place this page after weather_page):
#
#   lvgl:
#     pages:
#       # ... existing pages ...
#       - !include esphome-modular-lvgl-buttons/ui/calendar_page.yaml
#
# Cell ids consumed by ui/calendar.yaml scripts:
#   cal_c0..cal_c34     day cell buttons (bg swapped for "today" highlight)
#   cal_l0..cal_l34     day-number labels
#   cal_dot_0..cal_dot_34  event-indicator dots (hidden unless day has events)
#   cal_month_label     "July 2026" header

id: calendar_page
bg_color: 0x0F172A
bg_opa: COVER
pad_all: 12
# Re-render + refresh dots whenever the page is opened (swipe or tile).
on_load:
  - script.execute: cal_render_grid
  - script.execute: cal_fetch_dots
layout:
  type: flex
  flex_flow: COLUMN
  flex_align_main: START
  flex_align_cross: CENTER
  pad_row: 8
widgets:
  # ── Top bar: nav home | month header | spacer (keeps header centered) ──
  - obj:
      width: 100%
      height: SIZE_CONTENT
      styles: [cal_group_style]
      scrollable: false
      layout:
        type: flex
        flex_flow: ROW
        flex_align_main: SPACE_BETWEEN
        flex_align_cross: CENTER
      widgets:
        - button:
            width: 90
            height: 46
            styles: [cal_accent_style]
            widgets:
              - label:
                  text_font: mdi_icons_40
                  align: center
                  text: "$mdi_home"
            on_click:
              - lvgl.page.show: main_page

        - label:
            id: cal_month_label
            text: "Calendar"
            text_font: montserrat_24
            text_color: 0xF2F0EB

        - obj:
            width: 90
            height: 46
            styles: [cal_group_style]

  # ── Weekday header: Mo..Su, aligned with the 7 grid columns below ──
  - obj:
      width: 100%
      height: SIZE_CONTENT
      styles: [cal_group_style]
      scrollable: false
      layout:
        type: grid
        grid_columns: [fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1)]
        grid_rows: [content]
        pad_column: 4
      widgets:
        - label:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_x_align: center
            text: "Mo"
            text_color: 0x94A3B8
        - label:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 1
            grid_cell_x_align: center
            text: "Tu"
            text_color: 0x94A3B8
        - label:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 2
            grid_cell_x_align: center
            text: "We"
            text_color: 0x94A3B8
        - label:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 3
            grid_cell_x_align: center
            text: "Th"
            text_color: 0x94A3B8
        - label:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 4
            grid_cell_x_align: center
            text: "Fr"
            text_color: 0x94A3B8
        - label:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 5
            grid_cell_x_align: center
            text: "Sa"
            text_color: 0x94A3B8
        - label:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 6
            grid_cell_x_align: center
            text: "Su"
            text_color: 0x94A3B8

  # ── Day grid: 5 weeks x 7 days, cells stretch to fill the page ──
  - obj:
      width: 100%
      flex_grow: 1
      styles: [cal_group_style]
      scrollable: false
      layout:
        type: grid
        grid_columns: [fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1)]
        grid_rows: [fr(1), fr(1), fr(1), fr(1), fr(1)]
        pad_column: 4
        pad_row: 4
      widgets:
        - button:
            id: cal_c0
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            styles: [cal_cell_style]
            pad_all: 2
            widgets:
              - label:
                  id: cal_l0
                  align: top_mid
                  text: ""
                  text_font: montserrat_18
                  text_color: 0xF2F0EB
              - obj:
                  id: cal_dot_0
                  hidden: true
                  width: 12
                  height: 12
                  radius: 6
                  bg_color: 0xFBBF24
                  bg_opa: COVER
                  border_width: 0
                  align: bottom_mid
            on_click:
              - lambda: 'id(cal_selected_idx) = 0;'
              - script.execute: cal_open_day
        - button:
