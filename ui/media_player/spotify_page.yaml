# Spotify "Now Playing" — PAGE HALF (widget tree only). All logic (HA sensors,
# album art download, progress tick, UI refresh) lives in spotify.yaml; include
# that via `packages:` and include THIS file as a list item inside `lvgl.pages`
# where the page should sit in swipe order (see spotify.yaml header).
#
# Layout follows the generated-image reference (home button top-left, centered
# album art, title/artist + state badge, progress bar, transport row, volume
# slider) restyled with the music_page palette: bg 0x0F172A, cards
# 0x1E293B (card_style), blue accent 0x2563EB (action_style), slate buttons
# 0x334155 (media_button_style), green 0x22C55E progress/accents. Those shared
# styles are defined in media_player.yaml and are global after package merge.
#
# Queue button (top-mid) opens popup_spotify_queue, which fetches
# https://api.spotify.com/v1/me/player/queue directly via http_request — NOT
# through Home Assistant (HA's Spotify integration exposes no queue-retrieval
# service; only mass_queue/music_assistant services exist, and those only
# work with Music Assistant media_player entities). See
# ui/popup/spotify_queue_popup.yaml.
#
# Widget ids consumed by spotify.yaml:
#   sp_cover_art         album art image
#   sp_title_label       track title
#   sp_artist_label      artist
#   sp_state_badge       badge background (green when playing)
#   sp_state_label       badge text (PLAYING / PAUSED / IDLE)
#   sp_progress          read-only progress bar
#   sp_elapsed_label     mm:ss elapsed
#   sp_remaining_label   -mm:ss remaining
#   sp_play_pause_icon   play/pause glyph, swapped with state
#   sp_volume_slider     volume slider (synced from HA)
#   sp_volume_value      volume percent label

id: spotify_page
bg_color: 0x0F172A
bg_opa: COVER
widgets:
  # ── Top bar: home button top-left (same placement as music_page) ──
  - button:
      x: 20
      y: 16
      width: 90
      height: 38
      styles: [action_style]
      widgets:
        - label:
            text_font: mdi_icons_40
            align: center
            text: "$mdi_home"
      on_click:
        - lvgl.page.show: main_page

  # ── Queue button: top-mid, opens popup_spotify_queue ──
  - button:
      align: top_mid
      y: 16
      width: 90
      height: 38
      styles: [action_style]
      widgets:
        - label:
            text_font: mdi_icons_40
            align: center
            text: "$mdi_playlist_music"
      on_click:
        - script.execute: sp_fetch_queue
        - lvgl.widget.show: popup_scrim
        - lvgl.widget.show: popup_spotify_queue
        - script.execute: popup_start_timeout

  # Spotify logo — top right, brand green
  - label:
      align: top_right
      x: -24
      y: 16
      text: "$mdi_spotify"
      text_font: mdi_icons_40
      text_color: 0x1DB954

  # ── Album art card ──
  - obj:
      align: top_mid
      y: 60
      width: 200
      height: 200
      styles: [card_style]
      pad_all: 0            # override card_style's pad_all:12 so the art fills the card
      scrollable: false     # no scrollbars — art is sized to fit exactly
      clip_corner: true     # clip the art to the card's rounded corners
      widgets:
        - image:
            id: sp_cover_art
            width: 100%
            height: 100%
            align: center
            radius: 20
            src: sp_album_art

  # ── Title / artist + state badge ──
  - label:
      id: sp_title_label
      x: 24
      y: 268
      width: 320
      height: 30         # bound to one line so long_mode:dot truncates instead of wrapping
      long_mode: dot
      text: "Nothing playing"
      text_font: montserrat_22

  - label:
      id: sp_artist_label
      x: 24
      y: 300
      width: 320
      height: 24         # bound to one line so long_mode:dot truncates instead of wrapping
      long_mode: dot
      text: "Unknown artist"
      text_font: montserrat_16
      text_color: 0x94A3B8

  - obj:
      id: sp_state_badge
      align: top_right
      x: -24
      y: 268
      width: 96
      height: 32
      radius: 16
      border_width: 0
      pad_all: 0
      scrollable: false
      bg_color: 0x334155
      bg_opa: COVER
      widgets:
        - label:
            id: sp_state_label
            align: center
            text: "IDLE"

  # ── Progress (read-only — Spotify is cloud-polled, seek feedback would lag) ──
  # Single inline row like the reference image: elapsed | bar | -remaining
  - label:
      id: sp_elapsed_label
      x: 24
      y: 330
      text: "00:00"
      text_font: montserrat_16

  - bar:
      id: sp_progress
      x: 84
      y: 334
      width: 300
      height: 10
      min_value: 0
      max_value: 1000
      value: 0
      bg_color: 0x1E293B
      bg_opa: COVER
      radius: 5
      indicator:
        bg_color: 0x22C55E
        bg_opa: COVER
        radius: 5

  - label:
      id: sp_remaining_label
      x: 396
      y: 330
      text: "-00:00"
      text_font: montserrat_16

  # ── Transport: prev / play-pause / next ──
  # Per the reference image: play/pause is a solid green 64px circle; prev/next
  # are frosted-glass pills — LVGL can't blur, so the glass look is approximated
  # with a translucent white fill + faint white border over the dark bg.
  # Transport row is aligned to the progress bar above it: prev starts at the
  # bar's left edge (x 84), next ends at its right edge (x 384).
  - button:
      x: 84
      y: 367
      width: 110
      height: 54
      radius: 27
      bg_color: 0xFFFFFF
      bg_opa: 12%
      border_width: 1
      border_color: 0xFFFFFF
      border_opa: 25%
      shadow_width: 0
      widgets:
        - label:
            text_font: mdi_icons_40
            align: center
            text: "$mdi_skip_previous"
      on_click:
        - homeassistant.action:
            action: media_player.media_previous_track
            data:
              entity_id: ${spotify_media_entity}

  - button:
      x: 202
      y: 362
      width: 64
      height: 64
      radius: 32
      bg_color: 0x22C55E
      bg_opa: COVER
      border_width: 0
      shadow_width: 0
      widgets:
        - label:
            id: sp_play_pause_icon
            text_font: mdi_icons_40
            align: center
            text: "$mdi_play"
      on_click:
        - homeassistant.action:
            action: media_player.media_play_pause
            data:
              entity_id: ${spotify_media_entity}

  - button:
      x: 274
      y: 367
      width: 110
      height: 54
      radius: 27
      bg_color: 0xFFFFFF
      bg_opa: 12%
      border_width: 1
      border_color: 0xFFFFFF
      border_opa: 25%
      shadow_width: 0
      widgets:
        - label:
            text_font: mdi_icons_40
            align: center
            text: "$mdi_skip_next"
      on_click:
        - homeassistant.action:
            action: media_player.media_next_track
            data:
              entity_id: ${spotify_media_entity}

  # ── Volume: icon + slider + percent ──
  - label:
      x: 24
      y: 430
      text: "$mdi_volume_high"
      text_font: mdi_icons_40

  - slider:
      id: sp_volume_slider
      x: 84
      y: 446
      width: 300
      height: 12
      min_value: 0
      max_value: 100
      value: 0
      bg_color: 0x1E293B
      bg_opa: COVER
      radius: 6
      indicator:
        bg_color: 0x22C55E
        bg_opa: COVER
        radius: 6
      knob:
        bg_color: 0x22C55E
        bg_opa: COVER
      on_release:
        - homeassistant.action:
            action: media_player.volume_set
            data:
              entity_id: ${spotify_media_entity}
            data_template:
              volume_level: "{{ vol }}"
            variables:
              vol: !lambda |-
                float v = x / 100.0f;
                if (v < 0.0f) v = 0.0f;
                if (v > 1.0f) v = 1.0f;
                return v;

  - label:
      id: sp_volume_value
      x: 400
      y: 444
      text: "0%"
      text_font: montserrat_16

<<: !include ../../common/swipe_navigation.yaml
